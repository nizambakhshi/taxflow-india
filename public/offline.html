<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaxFlow India — Offline</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc; color: #1e293b; text-align: center; padding: 1.5rem; box-sizing: border-box;
    }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 2.5rem 2rem; max-width: 380px; }
    .icon { font-size: 44px; margin-bottom: 14px; }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { font-size: 13px; color: #64748b; line-height: 1.6; margin: 0 0 18px; }
    button {
      padding: 11px 22px; background: #2563eb; color: white; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You&apos;re offline</h1>
    <p>TaxFlow can&apos;t reach this page without internet. Invoices you created offline are safely queued and will sync automatically when you&apos;re back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
